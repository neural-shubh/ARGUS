[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "argus-narrative-intelligence"
version = "0.1.0"
description = "A modular NLP engine for document and narrative intelligence"
requires-python = ">=3.11,<3.15"
dependencies = [
    "torch",
    "transformers",
    "sentence-transformers",
    "PyMuPDF",
    "beautifulsoup4",
    "numpy",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]